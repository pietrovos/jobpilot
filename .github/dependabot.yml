version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: [next, eslint-config-next]
      prisma:
        patterns: [prisma, "@prisma/*"]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
